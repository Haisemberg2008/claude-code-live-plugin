name: verify

# The runtime is Windows-first: the broker singleton and the global quota mutex
# spawn `pwsh`, and several tests depend on Windows file-sharing semantics. The
# GitHub windows-latest image ships PowerShell 7 and Edge, which stock Windows
# 11 does not — that is why the full suite can pass here and be skipped locally.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: outputs/claude-code-live/runtime

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm
          cache-dependency-path: outputs/claude-code-live/runtime/package-lock.json

      # --ignore-scripts is the supply-chain policy the README states; keeping it
      # on the command line here means CI cannot silently drift from it.
      - name: install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: typecheck
        run: npm run typecheck

      - name: build
        run: npm run build

      # The plugin ships prebuilt bundles because an installed plugin never runs
      # npm install, so dist/ is committed on purpose. This proves the committed
      # bundles are the ones this source produces.
      #
      # Compared through the index, not the working tree: Vite emits CRLF on
      # Windows while esbuild emits LF, and it is git's checkin filter (see
      # .gitattributes) that normalizes both to LF. `git diff` on the working
      # tree would report every line of the Vite output as changed.
      - name: dist matches src
        shell: bash
        run: |
          git add --renormalize dist
          # build-info.json carries `builtWithNode`, which records the
          # environment that produced the bundle, not the source. A different
          # Node patch on the runner than on a developer machine is provenance,
          # not drift — so that one file is excluded here and compared field by
          # field below, rather than weakening the check or dropping the field.
          if ! git diff --cached --quiet -- dist ':!dist/build-info.json'; then
            echo "::error::dist/ nao corresponde ao src/ commitado. Rode 'npm run build' e commite o dist/ atualizado."
            git diff --cached --stat -- dist
            exit 1
          fi
          node -e "
            const { execSync } = require('node:child_process');
            const committed = JSON.parse(execSync('git show HEAD:outputs/claude-code-live/runtime/dist/build-info.json', { encoding: 'utf8' }));
            const built = JSON.parse(require('node:fs').readFileSync('dist/build-info.json', 'utf8'));
            const environmental = ['builtWithNode'];
            for (const field of environmental) { delete committed[field]; delete built[field]; }
            if (JSON.stringify(committed) !== JSON.stringify(built)) {
              console.error('::error::build-info.json divergiu em algo que nao e do ambiente (versoes de dependencia, entrypoints ou pacotes empacotados).');
              console.error('commitado:', JSON.stringify(committed));
              console.error('construido:', JSON.stringify(built));
              process.exit(1);
            }
          "
          echo "dist/ esta em sincronia com src/."

      - name: test
        run: npm test

      # Drives an already-installed Edge or Chrome through playwright-core; no
      # browser is downloaded. A broken panel blocks the release just like a
      # broken broker does.
      - name: browser tests
        run: npm run test:browser

      - name: upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tap-reports
          path: |
            outputs/claude-code-live/runtime/last-test-run.tap
            outputs/claude-code-live/runtime/last-browser-test-run.tap
          if-no-files-found: ignore
